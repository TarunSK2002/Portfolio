name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to MilesWeb
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd ~/tarun.tideorca.com

            if [ ! -d ".git" ]; then
            git init
              git remote add origin https://github.com/TarunSK2002/portfolio.git 
            fi

            git fetch origin
            git reset --hard origin/main
